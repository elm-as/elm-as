  <rect x="836" y="24" width="336" height="108" rx="8" fill="#FFFFFF" stroke="#0F1419" stroke-opacity="0.16"/>
  <text x="856" y="50" fill="#92400E" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="1.4">03 · PRODUITS EN PRODUCTION</text>
  <text x="856" y="78" fill="#0F1419" font-family="Georgia, serif" font-size="22">Apps Web, Mobile &amp; SaaS</text>
  <text x="856" y="102" fill="#525866" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5">Kova · DaloaMarket · OpenStats · Nerds</text>
